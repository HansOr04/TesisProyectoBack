# Integración continua del servidor (HU-60). Cada verificación es un trabajo
# propio y todas corren en paralelo: estilo, tipos, pruebas unitarias,
# migraciones, pruebas de integración y compilación. El último trabajo junta
# los resultados y es el que exige la protección de ramas (HU-62): si
# cualquiera falla, se cancela o no corre, el pull request no se puede integrar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# En un pull request, un push nuevo cancela la corrida anterior. En develop y
# main no: cada fusión tiene que quedar verificada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_ENV: test
  CORS_ORIGIN: http://localhost:5173

jobs:
  lint:
    name: Estilo (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npm run lint

  types:
    name: Tipos (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npx tsc --noEmit -p tsconfig.json

  unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      # Secreto de un solo uso para firmar los JWT de las pruebas; no es el
      # de producción, que vive solo en Heroku.
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # El reporter de GitHub marca cada prueba que falla en el pull request.
      - run: npm test -- --ci --silent --reporters=default --reporters=github-actions

  migrations:
    name: Migraciones y modelo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: assessment
          POSTGRES_PASSWORD: assessment
          POSTGRES_DB: assessment
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assessment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://assessment:assessment@localhost:5432/assessment?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - name: Aplicar migraciones y datos base
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      # HU-65: el modelo (schema.prisma) tiene que coincidir con lo que dejan
      # las migraciones. Si alguien cambia el modelo sin crear su migración,
      # el pull request no se puede integrar y el cambio nunca llega a Heroku.
      - name: El modelo coincide con las migraciones
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  e2e:
    name: Pruebas de integración (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: assessment
          POSTGRES_PASSWORD: assessment
          POSTGRES_DB: assessment
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assessment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://assessment:assessment@localhost:5432/assessment?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Base de prueba con migraciones y datos base
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      # --silent oculta los registros de la aplicación (avisos con trazas que
      # parecían errores); los fallos de las pruebas se siguen mostrando.
      - run: npm run test:e2e -- --ci --silent --reporters=default --reporters=github-actions

  build:
    name: Compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npm run build

  # Conserva el nombre del trabajo anterior porque es el que exige la
  # protección de ramas de develop y main.
  ci:
    name: Estilo, tipos y pruebas
    if: always()
    needs: [lint, types, unit, migrations, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de cada verificación
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "### Resultado de la integración continua" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verificación | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::No pasaron: $failed"
            exit 1
          fi
          echo "Todas las verificaciones pasaron."
