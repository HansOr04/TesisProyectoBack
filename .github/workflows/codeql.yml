# Análisis estático de seguridad del código (CodeQL): busca inyecciones,
# secretos expuestos, rutas inseguras y otros patrones vulnerables. Corre en
# paralelo con el CI en cada pull request y una vez por semana sobre main.
name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: análisis de código
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
