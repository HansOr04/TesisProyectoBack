# Análisis de calidad en SonarCloud (trabajo «sonar» del CI). La clave del
# proyecto y la organización las pone el workflow desde la variable
# SONAR_ORGANIZATION del repositorio.
sonar.projectName=TesisProyectoBack
sonar.sources=src,prisma
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=prisma/migrations/**,**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
